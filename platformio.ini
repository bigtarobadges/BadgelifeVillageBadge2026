; ===========================================================================
; PlatformIO configuration
;
; This project targets the Badgelife Village Badge (DC34, 2026), an RP2354
; based badge (2MB of onboard flash, no filesystem needed for this sketch)
; with LEDs, a vibration motor, a battery sense circuit, two touchpads,
; and an infrared receiver.
;
; Build and upload with PlatformIO:
;   pio run                         (compile only)
;   pio run --target upload         (compile and upload)
;
; This same folder can also be opened directly in the Arduino IDE.  See the
; README.md for the exact steps. Both tools compile the same source files
; in BadgeStub/ so use either one.
; ===========================================================================

[platformio]
; PlatformIO normally looks for source in ./src - this project's source
; lives in ./BadgeStub instead, because that folder doubles as an Arduino
; IDE sketch folder (Arduino requires the folder name to match the .ino
; file name inside it).
src_dir = BadgeStub

[env:badge_stub]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower

; --- Flash geometry ----------------------------------------------------
; The rpipico2 board definition assumes a 4MB flash chip. This badge's
; RP2354 only has 2MB of onboard flash, so the line below caps the
; linker to that size - otherwise it could place code past the end of
; physical flash. If your own board has 4MB or more, delete this line.
board_upload.maximum_size = 2097152
board_build.filesystem_size = 0m

build_flags =
    -DUSE_TINYUSB

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    z3t0/IRremote@^4.4.1
    mickey9801/ButtonFever@^1.0

lib_ldf_mode = deep+

monitor_speed = 115200

upload_protocol = mbed

board_build.f_cpu = 150000000L
